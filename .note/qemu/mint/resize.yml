TO Resize:
  Configuration:
    1: Make sure Spice Channel is available to VM
    2: Make the Video to Virtio
  Enable resize in the virt-manager - QEMU/KVM:
    View => Scale Display:
      1: Always
      2: Auto resize VM with window
  Install spice-vdagent: |
    sudo apt install spice-vdagent

    # If not enabled then manually enable it
    sudo systemctl enable --now spice-vdagentd

Mint Cinnamon then resizes when the qemu resizes:

Mint xfce needs the following steps:
  Manul resize: xrandr --output Virtual-1 --auto

  Auto resize:
    Install 11-xserver-utils: |
      sudo apt install x11-xserver-utils

    Create the automated script:
      1. File name: nano ~/.local/bin/xfce-autoresize.sh
      2. File content: |
        #!/bin/bash
        # Wait for the system to fully load the display server
        sleep 3

        # Read the main output device name automatically
        MONITOR=$(xrandr | awk '/ connected/ {print $1; exit}')

        # Fire once initially, then actively monitor the SPICE client channel
        xrandr --output "$MONITOR" --auto
        xev -root -event randr | while read -r line; do
            if [[ "$line" == *"XRROutputChangeNotifyEvent"* ]]; then
                xrandr --output "$MONITOR" --auto
            fi
        done

      3. Make it executable: chmod +x ~/.local/bin/xfce-autoresize.sh

    Link to XFCE startup:
      1: Go to Applications Menu > Settings > Session and Startup
      2: Switch to the Application Autostart tab
      3: Add new
      4: Name it SPICE Auto-Resize
      5: Browse the command field to ~/.local/bin/xfce-autoresize.sh
      6: Save and reboot the VM
